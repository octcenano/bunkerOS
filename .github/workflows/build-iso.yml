name: Bunker OS ISO

on:
push:
branches: [main]
paths:
- "bunker-os/"
- "iso/"
- ".github/workflows/build-iso.yml"
pull_request:
branches: [main]
paths:
- "bunker-os/"
- "iso/"
- ".github/workflows/build-iso.yml"
workflow_dispatch:

permissions:
contents: read

concurrency:
group: bunker-iso-${{ github.ref }}
cancel-in-progress: true

jobs:
build-iso:
name: Build bootable Arch ISO
runs-on: ubuntu-24.04
timeout-minutes: 90

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Prepare output directory
    run: mkdir -p out

  - name: Build ISO with archiso
    shell: bash
    run: |
      set -euo pipefail

      docker run --privileged --rm \
        -v "$GITHUB_WORKSPACE:/workspace" \
        -w /workspace \
        archlinux:latest \
        bash -euo pipefail -c '
          pacman -Syu --noconfirm archiso

          rm -rf /workspace/iso/profile
          mkdir -p /workspace/iso/profile
          cp -a /usr/share/archiso/configs/releng/. /workspace/iso/profile/

          mkdir -p /workspace/iso/profile/airootfs/opt/bunker-os
          cp -a /workspace/bunker-os/. /workspace/iso/profile/airootfs/opt/bunker-os/
          rm -rf /workspace/iso/profile/airootfs/opt/bunker-os/.github

          mkdir -p /workspace/iso/profile/airootfs/etc
          printf "%s\n" \
            "Bunker OS - ISO de desarrollo" \
            "Entorno live basado en Arch Linux." \
            "Código del proyecto: /opt/bunker-os" \
            "Prototipo: revisar README antes de instalar." \
            > /workspace/iso/profile/airootfs/etc/motd

          mkdir -p /workspace/out
          mkarchiso -v \
            -w /tmp/bunker-archiso-work \
            -o /workspace/out \
            /workspace/iso/profile
        '

  - name: Verify ISO and generate checksum
    shell: bash
    run: |
      set -euo pipefail
      shopt -s nullglob
      images=(out/*.iso)

      if (( ${#images[@]} == 0 )); then
        echo "::error::No se generó ningún archivo ISO."
        exit 1
      fi

      ls -lh "${images[@]}"
      sha256sum "${images[@]}" | tee out/SHA256SUMS

  - name: Upload ISO artifact
    uses: actions/upload-artifact@v4
    with:
      name: bunker-os-iso-${{ github.run_number }}
      path: |
        out/*.iso
        out/SHA256SUMS
      if-no-files-found: error
      retention-days: 14
