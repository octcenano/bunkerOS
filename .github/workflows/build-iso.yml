name: Bunker OS ISO

on:
  push:
    branches:
      - main
    paths:
      - "bunker-os/**"
      - "iso/**"
      - ".github/workflows/build-iso.yml"

  pull_request:
    branches:
      - main
    paths:
      - "bunker-os/**"
      - "iso/**"
      - ".github/workflows/build-iso.yml"

  workflow_dispatch:

permissions:
  contents: read
