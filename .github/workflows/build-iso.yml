name: Build ISO

on:
  push:
    branches: [ main ]
    paths:
      - 'bunker-os/**'
      - '.github/workflows/build-iso.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'bunker-os/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de operacion para la ISO'
        required: true
        default: 'custom'
        type: choice
        options:
        - gaming
        - ia
        - ghost
        - office
        - hacking
        - custom
      layer:
        description: 'Capa para la ISO'
        required: false
        default: ''
        type: string

jobs:
  build-iso:
    name: Build Bunker OS ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            archiso \
            mkinitcpio \
            syslinux \
            grub \
            efibootmgr \
            dosfstools \
            mtools \
            bash \
            coreutils \
            util-linux \
            grep \
            sed \
            awk \
            findutils \
            gawk \
            tar \
            gzip \
            xz \
            make \
            git

      - name: Prepare build directory
        run: |
          mkdir -p /tmp/bunker-iso
          cp -r bunker-os /tmp/bunker-iso/
          cd /tmp/bunker-iso

      - name: Create ISO structure
        run: |
          cd /tmp/bunker-iso
          # Create archiso profile structure
          mkdir -p /tmp/archiso/releng
          cp -r /usr/share/archiso/configs/releng/* /tmp/archiso/releng/ 2>/dev/null || true
          
          # Copy Bunker OS files to archiso
          mkdir -p /tmp/archiso/releng/airootfs/usr/lib/bunker
          cp -r bunker-os/* /tmp/archiso/releng/airootfs/usr/lib/bunker/
          mkdir -p /tmp/archiso/releng/airootfs/usr/bin
          cp bunker-os/cli/bunker /tmp/archiso/releng/airootfs/usr/bin/bunker
          chmod +x /tmp/archiso/releng/airootfs/usr/bin/bunker
          
          # Create systemd service directory
          mkdir -p /tmp/archiso/releng/airootfs/usr/lib/systemd/system
          cp bunker-os/base/systemd/*.service /tmp/archiso/releng/airootfs/usr/lib/systemd/system/ 2>/dev/null || true
          
          # Create etc directory
          mkdir -p /tmp/archiso/releng/airootfs/etc/bunker
          cp bunker-os/base/etc/bunker.conf /tmp/archiso/releng/airootfs/etc/bunker/bunker.conf

      - name: Customize airootfs
        run: |
          cd /tmp/archiso/releng/airootfs
          
          # Enable only NetworkManager by default (no SSH, no Tor)
          # Services should be enabled by user during installation
          systemctl enable NetworkManager.service 2>/dev/null || true
          
          # Set hostname
          echo "bunkerOS" > etc/hostname
          
          # Set locale to Spanish (es_ES) as default
          echo "LANG=es_ES.UTF-8" > etc/locale.conf
          echo "LC_ALL=es_ES.UTF-8" >> etc/locale.conf
          
          # Configure locale gen
          echo "es_ES.UTF-8 UTF-8" > etc/locale.gen
          echo "en_US.UTF-8 UTF-8" >> etc/locale.gen
          
          # Create user with random password (will be set during installation)
          useradd -m -G wheel -s /bin/bash bunker 2>/dev/null || true
          echo "bunker ALL=(ALL) ALL" >> etc/sudoers
          
          # Enable sudo for wheel group
          sed -i 's/^# %wheel ALL=(ALL) ALL/%wheel ALL=(ALL) ALL/' etc/sudoers
          
          # Lock root account - user must set password during installation
          passwd -l root 2>/dev/null || true
          
          # Create first-boot setup script
          cat > /tmp/archiso/releng/airootfs/root/first-boot.sh << 'FIRSTBOOTEOF'
#!/bin/bash
# First boot setup - prompts user for password and optional services

set -e

echo "========================================"
echo "  BUNKER OS - First Boot Configuration"
echo "========================================"
echo ""

# Set root password
while true; do
    read -s -p "Enter new root password: " root_pass
    echo ""
    read -s -p "Confirm root password: " root_pass_confirm
    echo ""
    if [[ "$root_pass" == "$root_pass_confirm" ]] && [[ -n "$root_pass" ]]; then
        echo "root:$root_pass" | chpasswd
        break
    else
        echo "Passwords do not match or are empty. Try again."
    fi
done

# Set bunker user password
while true; do
    read -s -p "Enter new bunker user password: " user_pass
    echo ""
    read -s -p "Confirm bunker user password: " user_pass_confirm
    echo ""
    if [[ "$user_pass" == "$user_pass_confirm" ]] && [[ -n "$user_pass" ]]; then
        echo "bunker:$user_pass" | chpasswd
        break
    else
        echo "Passwords do not match or are empty. Try again."
    fi
done

# Ask about locale
echo ""
echo "Current locale: es_ES.UTF-8"
read -p "Change locale? (y/n) [n]: " change_locale
if [[ "$change_locale" == "y" || "$change_locale" == "Y" ]]; then
    read -p "Enter locale (e.g., en_US.UTF-8): " new_locale
    if [[ -n "$new_locale" ]]; then
        sed -i "s|LANG=.*|LANG=$new_locale|" /etc/locale.conf
        sed -i "s|LC_ALL=.*|LC_ALL=$new_locale|" /etc/locale.conf
    fi
fi

# Ask about enabling SSH
echo ""
read -p "Enable SSH service? (y/n) [n]: " enable_ssh
if [[ "$enable_ssh" == "y" || "$enable_ssh" == "Y" ]]; then
    systemctl enable sshd.service
    echo "SSH enabled. Configure firewall rules manually."
fi

# Ask about enabling Tor (only for hacking mode)
echo ""
read -p "Enable Tor service? (y/n) [n]: " enable_tor
if [[ "$enable_tor" == "y" || "$enable_tor" == "Y" ]]; then
    systemctl enable tor.service
    echo "Tor enabled. Configure firewall rules manually."
fi

# Clean up
rm -f /root/first-boot.sh
reboot
FIRSTBOOTEOF
          chmod +x /tmp/archiso/releng/airootfs/root/first-boot.sh
          
          # Add first-boot to systemd
          cat > /tmp/archiso/releng/airootfs/usr/lib/systemd/system/first-boot.service << 'SERVICEEOF'
[Unit]
Description=First Boot Configuration
After=systemd-user-sessions.service
Before=multi-user.target

[Service]
Type=oneshot
ExecStart=/root/first-boot.sh
RemainAfterExit=yes

[Install]
WantedBy=multi-user.target
SERVICEEOF
          
          systemctl enable first-boot.service 2>/dev/null || true

      - name: Build ISO
        run: |
          cd /tmp/archiso/releng
          
          # Create profiledef.sh with custom settings
          cat > profiledef.sh << 'PROFILEEOF'
#!/bin/bash

_iso_name="BunkerOS-v2.6.1-stabilization-${{ inputs.mode }}"
_iso_label="BUNKEROS_261_${{ inputs.mode }}"
_iso_publisher="Bunker OS Team"
_iso_application="Bunker OS Live"
_iso_version="2.6.1-stabilization"

_boot_params=("archisobasedir=bunkerOS" "copytoram" "cow_spacesize=4G")

_airootfs_fs_type="ext4"
_airootfs_fs_options="-O ^metadata_csum,^64bit -E root_owner=0:0"

_iso_compression="zstd"
_iso_compression_level="22"
PROFILEEOF
          
          # Build the ISO
          mkarchiso -v /tmp/archiso/releng /tmp/archiso/out 2>&1 | tee /tmp/build.log
          
          # Verify ISO was created
          if [[ ! -f /tmp/archiso/out/*.iso ]]; then
            echo "ERROR: ISO build failed"
            exit 1
          fi

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: BunkerOS-v2.6.1-stabilization-ISO
          path: /tmp/archiso/out/*.iso
          compression-level: 9
          retention-days: 30

      - name: Create release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v2.6.1-stabilization-${{ github.run_number }}
          name: Bunker OS v2.6.1-stabilization - Build ${{ github.run_number }}
          body: |
            ISO de Bunker OS v2.6.1-stabilization
            
            **Modo:** ${{ inputs.mode || 'custom' }}
            **Capa:** ${{ inputs.layer || 'ninguna' }}
            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            
            ### Cambios en v2.6.1-stabilization:
            - SEGURIDAD: Eliminadas credenciales por defecto
            - SEGURIDAD: SSH y Tor deshabilitados por defecto
            - SEGURIDAD: Configuracion de usuario durante primer arranque
            - SEGURIDAD: Locale es_ES.UTF-8 por defecto
            - CORRECCIONES: Error de sintaxis en analyze-exam.sh
            - CORRECCIONES: Eliminado directorio hadware/ duplicado
            - CORRECCIONES: Workflows unificados
            
            ### Como usar:
            1. Descarga la ISO
            2. Graba en USB: `dd if=BunkerOS-*.iso of=/dev/sdX bs=4M status=progress oflag=sync`
            3. Arranca desde USB
            4. Sigue las instrucciones de configuracion en el primer arranque
            5. Inicia sesion con las credenciales que hayas configurado
            
            ### Advertencia de seguridad:
            - No hay credenciales por defecto
            - Debes configurar contrasenias durante el primer arranque
            - SSH y Tor deben ser habilitados manualmente
            
            ### Descarga:
            La ISO estara disponible en los artifacts de esta accion y en los releases.
          files: /tmp/archiso/out/*.iso
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-iso:
    name: Test ISO
    needs: build-iso
    runs-on: ubuntu-latest
    
    steps:
      - name: Download ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: BunkerOS-v2.6.1-stabilization-ISO
          path: /tmp/iso
      
      - name: Verify ISO
        run: |
          ls -lh /tmp/iso/*.iso
          file /tmp/iso/*.iso
          # Basic integrity check
          sha256sum /tmp/iso/*.iso
