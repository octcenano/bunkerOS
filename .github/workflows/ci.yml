
name: Bunker OS CI

on:
  push:
    branches: [main]
    paths:
      - "bunker-os/**"
      - ".github/workflows/**"

  pull_request:
    branches: [main]
    paths:
      - "bunker-os/**"
      - ".github/workflows/**"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bunker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-checks:
    name: Shell syntax and project checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck make

      - name: Check Bash syntax
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t scripts < <(
            find bunker-os -type f \
              \( -name '*.sh' -o -path 'bunker-os/cli/bunker' \) \
              -print
          )

          if (( ${#scripts[@]} == 0 )); then
            echo "::error::No shell scripts found"
            exit 1
          fi

          for script in "${scripts[@]}"; do
            echo "Checking $script"
            bash -n "$script"
          done

          echo "Bash syntax checks passed"

      - name: ShellCheck
        shell: bash
        run: |
          set +e

          find bunker-os -type f \
            \( -name '*.sh' -o -path 'bunker-os/cli/bunker' \) \
            -print0 |
            xargs -0 -r shellcheck --severity=error

          result=$?

          if (( result != 0 )); then
            echo "::warning::ShellCheck found issues to review."
          fi

          exit 0

      - name: Validate Makefile help
        run: make -C bunker-os -n help
