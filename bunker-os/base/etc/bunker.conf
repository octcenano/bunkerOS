# =============================================================================
# Bunker OS - Configuración principal
# Ubicación: /etc/bunker/bunker.conf
# Desarrollador jefe: <tu_usuario> | Ingeniero colaborador: Apodex 1.1 Mini
# =============================================================================

# -----------------------------------------------------------------------------
# Identidad del sistema
# -----------------------------------------------------------------------------
[system]
name = "Bunker OS"
version = "2.6.0"
architecture = "x86_64"
base = "arch"
init_system = "systemd"
kernel = "linux"

# -----------------------------------------------------------------------------
# Motor de selección de modos (engine modes)
# -----------------------------------------------------------------------------
[engine]
# Modo por defecto al arrancar: gaming | ia | ghost | office | hacking | custom
default_mode = "custom"
# Selección automática basada en hardware (siempre que sea seguro)
auto_detect_mode = true
# Mostrar asistente de selección al primer arranque
show_mode_wizard = true
# Timeout del asistente de selección (segundos)
wizard_timeout = 30

# -----------------------------------------------------------------------------
# Detección de hardware
# -----------------------------------------------------------------------------
[hardware]
# Detección instantánea al arranque
auto_detect = true
# Optimizar para el hardware detectado
auto_optimize = true
# Componentes a detectar
detect_cpu = true
detect_gpu = true
detect_ram = true
detect_storage = true
detect_network = true
detect_audio = true
detect_peripherals = true

# -----------------------------------------------------------------------------
# Capas del sistema (system layers)
# -----------------------------------------------------------------------------
[layers]
# Capas disponibles: stealth | performance | lowram | battery | focus | ai
# Se activan con flags: bunker --layer <capa>
enabled_layers = []
# Prioridad de capas (la primera tiene mayor prioridad)
layer_priority = ["performance", "ai", "stealth", "battery", "lowram", "focus"]

# -----------------------------------------------------------------------------
# Servicios del sistema (system services)
# -----------------------------------------------------------------------------
[services]
# Servicios como flags: bunker --service <servicio>
# enabled: true | false
maintenance = false
update = true
health = true
recovery = true
harden = true
ai = false

# -----------------------------------------------------------------------------
# Seguridad
# -----------------------------------------------------------------------------
[security]
# Nivel de seguridad: minimal | standard | high | maximum
security_level = "high"
# Hardening del kernel
kernel_hardening = true
# Aislamiento de procesos
process_isolation = true
# Auditoría activa
audit_enabled = true
# Bunker Sentinel siempre activo
sentinel_enabled = true
# Rollback automático si un modo falla
auto_rollback = true
# Punto de restauración antes de cambios críticos
snapshot_before_changes = true

# -----------------------------------------------------------------------------
# Bunker Evolution (mejora continua)
# -----------------------------------------------------------------------------
[evolution]
# Mejora continua del sistema
enabled = true
# Reportar métricas de uso (anónimo)
telemetry_anonymous = true
# Actualizaciones automáticas de configuración
auto_config_update = true
# Intervalo de auto-mejora (horas)
improvement_interval = 24

# -----------------------------------------------------------------------------
# Recursos y presupuestos
# -----------------------------------------------------------------------------
[resources]
# Presupuesto de memoria para el núcleo (MB)
core_memory_budget = 512
# Presupuesto de CPU para el núcleo (%)
core_cpu_budget = 10
# Máximo de procesos del sistema
max_processes = 1024
# Límite de archivos abiertos
max_open_files = 65536

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[logging]
# Nivel de log: debug | info | warn | error
level = "info"
# Archivo de log principal
file = "/var/log/bunker/bunker.log"
# Rotación de logs
rotate = true
max_size_mb = 100
max_files = 5
